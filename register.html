<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Vajra</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:linear-gradient(135deg,#0F172A,#166534);

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.register-box{

width:520px;

background:white;

padding:40px;

border-radius:24px;

box-shadow:0 20px 60px rgba(0,0,0,.25);

animation:fade .6s ease;

}

.logo{

text-align:center;

font-size:42px;

font-weight:800;

color:#16A34A;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#64748B;

margin-bottom:35px;

line-height:1.6;

}

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:18px;

}

.input{

margin-bottom:18px;

}

.input label{

display:block;

font-weight:600;

margin-bottom:8px;

}

.input input,
.input select{

width:100%;

padding:15px;

border:1px solid #CBD5E1;

border-radius:12px;

font-size:15px;

outline:none;

transition:.3s;

}

.input input:focus,
.input select:focus{

border-color:#16A34A;

box-shadow:0 0 0 4px rgba(22,163,74,.12);

}

.full{

grid-column:1/-1;

}

.checkbox{

display:flex;

align-items:flex-start;

gap:10px;

margin:20px 0;

font-size:14px;

color:#475569;

}

.checkbox a{

color:#16A34A;

text-decoration:none;

}

.signup-btn{

width:100%;

padding:16px;

background:#16A34A;

color:white;

font-size:17px;

border:none;

border-radius:12px;

cursor:pointer;

transition:.3s;

}

.signup-btn:hover{

background:#15803D;

}

.divider{

margin:28px 0;

text-align:center;

position:relative;

color:#94A3B8;

}

.divider::before{

content:"";

position:absolute;

left:0;

top:50%;

width:42%;

height:1px;

background:#CBD5E1;

}

.divider::after{

content:"";

position:absolute;

right:0;

top:50%;

width:42%;

height:1px;

background:#CBD5E1;

}

.social{

display:grid;

gap:15px;

}

.social button{

padding:14px;

border-radius:12px;

background:white;

border:1px solid #CBD5E1;

cursor:pointer;

transition:.3s;

font-size:15px;

}

.social button:hover{

background:#F8FAFC;

}

.footer{

margin-top:30px;

text-align:center;

color:#64748B;

}

.footer a{

color:#16A34A;

font-weight:600;

text-decoration:none;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media(max-width:600px){

.register-box{

width:100%;

padding:30px;

}

.grid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="register-box">

<div class="logo">

⚡ Vajra

</div>

<p class="subtitle">

Create your Vajra account and start charging or earning today.

</p>

<form>

<div class="grid">

<div class="input">

<label>First Name</label>

<input type="text" placeholder="First Name" required>

</div>

<div class="input">

<label>Last Name</label>

<input type="text" placeholder="Last Name" required>

</div>

<div class="input full">

<label>Email Address</label>

<input type="email" placeholder="you@example.com" required>

</div>

<div class="input">

<label>Phone Number</label>

<input type="tel" placeholder="+91 9876543210" required>

</div>

<div class="input">

<label>Account Type</label>

<select>

<option>Driver</option>

<option>Host</option>

<option>Both</option>

</select>

</div>

<div class="input full">

<label>Password</label>

<input type="password" placeholder="Create Password" required>

</div>

<div class="input full">

<label>Confirm Password</label>

<input type="password" placeholder="Confirm Password" required>

</div>

</div>

<div class="checkbox">

<input type="checkbox" required>

<p>

I agree to the
<a href="#">Terms of Service</a>
and
<a href="#">Privacy Policy</a>.

</p>

</div>

<button class="signup-btn">

Create Account

</button>

</form>

<div class="divider">

OR

</div>

<div class="social">

<button>

🔵 Continue with Google

</button>

<button>

🍎 Continue with Apple

</button>

</div>

<div class="footer">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
