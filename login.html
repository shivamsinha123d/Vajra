<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Vajra</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{

background:linear-gradient(135deg,#0F172A,#14532D);

font-family:'Inter',sans-serif;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.login-box{

width:420px;

background:white;

padding:40px;

border-radius:24px;

box-shadow:0 20px 60px rgba(0,0,0,.25);

animation:fade .7s;

}

.logo{

text-align:center;

font-size:40px;

font-weight:800;

color:#16A34A;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#64748B;

margin-bottom:35px;

}

.input{

margin-bottom:20px;

}

.input label{

display:block;

font-weight:600;

margin-bottom:8px;

}

.input input{

width:100%;

padding:15px;

border:1px solid #CBD5E1;

border-radius:12px;

outline:none;

font-size:15px;

transition:.3s;

}

.input input:focus{

border-color:#16A34A;

box-shadow:0 0 0 4px rgba(22,163,74,.12);

}

.options{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

font-size:14px;

}

.options a{

color:#16A34A;

text-decoration:none;

}

.login-btn{

width:100%;

padding:16px;

border:none;

background:#16A34A;

color:white;

font-size:17px;

border-radius:12px;

cursor:pointer;

transition:.3s;

}

.login-btn:hover{

background:#15803D;

}

.divider{

text-align:center;

margin:25px 0;

position:relative;

color:#94A3B8;

}

.divider:before{

content:"";

position:absolute;

left:0;

top:50%;

width:42%;

height:1px;

background:#CBD5E1;

}

.divider:after{

content:"";

position:absolute;

right:0;

top:50%;

width:42%;

height:1px;

background:#CBD5E1;

}

.social{

display:grid;

gap:15px;

}

.social button{

padding:14px;

background:white;

border:1px solid #CBD5E1;

border-radius:12px;

cursor:pointer;

font-size:15px;

transition:.3s;

}

.social button:hover{

background:#F8FAFC;

}

.footer{

margin-top:30px;

text-align:center;

color:#64748B;

}

.footer a{

color:#16A34A;

text-decoration:none;

font-weight:600;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(25px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">

⚡ Vajra

</div>

<p class="subtitle">

Welcome back! Login to your account.

</p>

<form>

<div class="input">

<label>Email</label>

<input
type="email"
placeholder="you@example.com"
required>

</div>

<div class="input">

<label>Password</label>

<input
type="password"
placeholder="••••••••"
required>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">

Forgot Password?

</a>

</div>

<button class="login-btn">

Login

</button>

</form>

<div class="divider">

OR

</div>

<div class="social">

<button>

 Continue with Google

</button>

<button>

 Continue with Apple

</button>

</div>

<div class="footer">

Don't have an account?

<a href="register.html">

Create Account

</a>

</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
