/* Top Search */

// Distance Calculation


function dist(a,b,c,d)

{


const R=6371;


const x=(c-a)*Math.PI/180;

const y=(d-b)*Math.PI/180;



const q=

Math.sin(x/2)**2+

Math.cos(a*Math.PI/180)*

Math.cos(c*Math.PI/180)*

Math.sin(y/2)**2;



return (

R*2*Math.atan2(

Math.sqrt(q),

Math.sqrt(1-q)

)

).toFixed(1);


}

document.getElementById("details").innerHTML=

`${ch.power} • ₹${ch.price}/kWh • ⭐${ch.rating}`;



if(userLat)

document.getElementById("distance").innerHTML=

dist(

userLat,

userLng,

ch.lat,

ch.lng

)+" km away";



map.setView(

[ch.lat,ch.lng],

});

// Search Location


async function searchPlace(){


let place=

document.getElementById("search").value;



if(place==""){

alert("Enter location");

return;

}



let url=

`https://nominatim.openstreetmap.org/search?format=json&q=${place}`;



let response=

await fetch(url);



let data=

await response.json();



if(data.length==0)

{

alert("Location not found");

return;

}



let lat=data[0].lat;

let lon=data[0].lon;



map.setView(

[lat,lon],

14

);



L.marker(

[lat,lon]

)

.addTo(map)

.bindPopup(place)

.openPopup();


}







function navigate(){

{

alert("Select charger first");

return;

}



window.open(

`https://www.google.com/maps/dir/?api=1&destination=${selected.lat},${selected.lng}`

);


}






function reserve(){

"Reservation request sent for "+selected.name
