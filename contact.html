<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact - Vajra</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{

    background:#f5f7f6;
    color:#222;

}



/* Navigation */

nav{

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 50px;

    background:#16a34a;

    color:white;

}


nav h2{

    font-size:28px;

}


nav a{

    color:white;
    text-decoration:none;

    margin-left:25px;

    font-size:16px;

}


nav a:hover{

    text-decoration:underline;

}





/* Contact Section */


.contact{

    padding:60px 20px;

    text-align:center;

}



.contact h1{

    font-size:42px;

    color:#16a34a;

    margin-bottom:15px;

}



.contact p{

    font-size:18px;

    color:#555;

}




.contact-box{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:50px;

    flex-wrap:wrap;

    margin-top:40px;

}





/* Contact Details */


.details{

    background:white;

    width:320px;

    padding:35px;

    border-radius:20px;

    box-shadow:0 8px 25px rgba(0,0,0,0.12);

}



.details h2{

    color:#16a34a;

    margin-bottom:25px;

}


.details p{

    margin-top:20px;

    font-size:16px;

}


.details h3{

    margin-top:8px;

    font-size:18px;

}






/* Form */


form{

    background:white;

    width:380px;

    padding:35px;

    border-radius:20px;

    box-shadow:0 8px 25px rgba(0,0,0,0.12);

}



input,
textarea{


    width:100%;

    padding:14px;

    margin-bottom:15px;

    border-radius:10px;

    border:1px solid #ddd;

    font-size:15px;

}



textarea{

    height:130px;

    resize:none;

}



button{


    width:100%;

    padding:14px;

    background:#16a34a;

    color:white;

    border:none;

    border-radius:10px;

    font-size:17px;

    cursor:pointer;

}



button:hover{

    background:#12813b;

}






/* Footer */


footer{

    margin-top:60px;

    background:#111;

    color:white;

    text-align:center;

    padding:20px;

}





/* Mobile */


@media(max-width:700px){


nav{

    flex-direction:column;

    gap:15px;

}


nav a{

    margin:0 8px;

}


.contact h1{

    font-size:32px;

}


form,
.details{

    width:90%;

}


}



</style>


</head>


<body>


<nav>

<h2>⚡ Vajra</h2>

<div>

<a href="index.html">Home</a>

<a href="find.html">Find Chargers</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

</div>

</nav>



<section class="contact">


<h1>Contact Vajra</h1>

<p>
Need help, want to list your charger, or have suggestions?
We would love to hear from you.
</p>



<div class="contact-box">


<div class="details">

<h2>Get in Touch</h2>


<p>📧 Email</p>

<h3>support@vajraev.com</h3>



<p>📞 Phone</p>

<h3>+91 11111 11111</h3>



<p>📍 Location</p>

<h3>Pune, Maharashtra</h3>


</div>




<form>


<input type="text" placeholder="Your Name" required>


<input type="email" placeholder="Your Email" required>


<input type="text" placeholder="Subject">


<textarea placeholder="Write your message"></textarea>


<button type="submit">

Send Message

</button>


</form>



</div>


</section>




<footer>

© 2026 Vajra EV Network

</footer>



</body>

</html>
